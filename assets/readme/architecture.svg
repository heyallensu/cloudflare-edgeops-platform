<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">EdgeOps request and deployment architecture</title>
  <desc id="desc">Public requests reach the Worker directly while administrative requests cross Cloudflare Access and application JWT verification before using protected APIs and D1. GitHub Actions is planned as the deployment path.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#73e6d1"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ffc15c"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="20" fill="#071017"/>
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="#344754"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="42" y="48" fill="#73e6d1" font-size="13" letter-spacing="2">SYSTEM MAP / TRUST BOUNDARIES</text>
    <text x="1158" y="48" fill="#8e9eae" font-size="12" text-anchor="end">PUBLIC READ · PROTECTED WRITE</text>
  </g>
  <path d="M42 72H1158" stroke="#20303b"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(42 108)">
      <rect width="170" height="88" fill="#0b1720" stroke="#344754"/>
      <text x="20" y="33" fill="#e8edf2" font-size="17" font-weight="600">Public browser</text>
      <text x="20" y="60" fill="#8e9eae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/ · /api/health</text>
    </g>
    <path d="M212 152H338" stroke="#73e6d1" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(42 236)">
      <rect width="170" height="88" fill="#0b1720" stroke="#344754"/>
      <text x="20" y="33" fill="#e8edf2" font-size="17" font-weight="600">Admin browser</text>
      <text x="20" y="60" fill="#8e9eae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/admin*</text>
    </g>
    <path d="M212 280H278" stroke="#ffc15c" stroke-width="2" marker-end="url(#arrow-amber)"/>

    <g transform="translate(298 226)">
      <rect width="178" height="108" fill="#0b1720" stroke="#ffc15c"/>
      <text x="89" y="35" fill="#ffc15c" font-size="16" font-weight="600" text-anchor="middle">Cloudflare Access</text>
      <text x="89" y="62" fill="#8e9eae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">OTP / allow policy</text>
      <text x="89" y="84" fill="#8e9eae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">JWT assertion</text>
    </g>
    <path d="M476 280H538" stroke="#ffc15c" stroke-width="2" marker-end="url(#arrow-amber)"/>

    <g transform="translate(558 108)">
      <rect width="250" height="226" fill="#101f29" stroke="#73e6d1"/>
      <text x="125" y="38" fill="#e8edf2" font-size="19" font-weight="650" text-anchor="middle">Cloudflare Worker</text>
      <text x="125" y="65" fill="#8e9eae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">NEXT.JS / OPENNEXT</text>
      <path d="M22 86H228" stroke="#344754"/>
      <text x="28" y="118" fill="#73e6d1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PUBLIC</text>
      <text x="28" y="141" fill="#b3c0cb" font-size="13">Dashboard + health</text>
      <text x="28" y="179" fill="#ffc15c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PROTECTED</text>
      <text x="28" y="202" fill="#b3c0cb" font-size="13">JWT guard + Zod APIs</text>
    </g>
    <path d="M808 220H880" stroke="#73e6d1" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(900 146)">
      <rect width="258" height="148" fill="#0b1720" stroke="#344754"/>
      <text x="129" y="40" fill="#e8edf2" font-size="19" font-weight="650" text-anchor="middle">D1</text>
      <text x="129" y="67" fill="#8e9eae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">FORWARD-ONLY MIGRATIONS</text>
      <path d="M24 86H234" stroke="#20303b"/>
      <text x="129" y="113" fill="#b3c0cb" font-size="13" text-anchor="middle">services · deployments · incidents</text>
    </g>
  </g>

  <g transform="translate(42 382)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="0" y="0" fill="#8e9eae">01  ACCESS IS SCOPED TO /ADMIN*</text>
    <text x="340" y="0" fill="#8e9eae">02  JWT IS VERIFIED AGAIN IN-APP</text>
    <text x="710" y="0" fill="#8e9eae">03  IDENTITY DATA IS NOT PERSISTED</text>
  </g>
</svg>
