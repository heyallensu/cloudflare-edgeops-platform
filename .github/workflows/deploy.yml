name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeops-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:static
      - name: Apply forward-only D1 migrations
        run: npx wrangler d1 migrations apply edgeops-dashboard-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build:worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify public health and dashboard
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL}/api/health" >/dev/null \
              && curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL}/" >/dev/null; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then sleep 10; fi
          done
          exit 1
